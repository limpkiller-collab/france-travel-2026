<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 프랑스 : 에펠탑 (그라데이션 스타일) -->
  <defs>
    <linearGradient id="g" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5B8DEF"/>
      <stop offset="55%" stop-color="#8F7BF3"/>
      <stop offset="100%" stop-color="#C9A8F7"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#7B8CF0" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="#FFFFFF"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#EEEEF2" stroke-width="3"/>
  <g filter="url(#soft)" transform="translate(256,250)">
    <!-- 꼭대기 안테나 -->
    <path d="M0 -206 L0 -172" stroke="url(#g)" stroke-width="14" stroke-linecap="round"/>
    <!-- 상단부 -->
    <path d="M-13 -168 L13 -168 L22 -106 L-22 -106 Z" fill="url(#g)"/>
    <rect x="-34" y="-106" width="68" height="22" rx="10" fill="url(#g)"/>
    <!-- 중단부 -->
    <path d="M-26 -84 L26 -84 L46 10 L-46 10 Z" fill="url(#g)"/>
    <rect x="-62" y="10" width="124" height="24" rx="11" fill="url(#g)"/>
    <!-- 다리 (아치 포함) -->
    <path d="M-52 34 L52 34
             C 56 88, 92 152, 138 196
             L84 196
             C 52 160, 30 124, 22 88
             Q 0 74, -22 88
             C -30 124, -52 160, -84 196
             L-138 196
             C -92 152, -56 88, -52 34 Z" fill="url(#g)"/>
    <!-- 격자 느낌(밝은 줄) -->
    <path d="M-30 -60 L30 -34 M30 -60 L-30 -34 M-38 -20 L38 -60 M-38 -60 L38 -20"
          stroke="#FFFFFF" stroke-opacity="0" stroke-width="0"/>
    <path d="M-36 -30 L36 -30 M-42 -8 L42 -8" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="10" stroke-linecap="round"/>
  </g>
</svg>
